schema: spec-driven

# Shared project context.
# Keep this short: it is injected into artifact instructions.
# Detailed knowledge is discovered through indexes, not copied here.
context: |
  Tellipod is an Expo / React Native application for iOS and Android,
  built in a pnpm monorepo. Desktop is out of scope.

  Tellipod is a client of the Mee PDN. The app renders data and submits
  user actions. Node and data-layer responsibilities, including the data
  model, visibility, merging, propagation, and permission enforcement,
  are defined outside this repository.

  Authoritative sources:
  - MeeFoundation/pod-ontologies: pod behavior (app-behavior.md) and
    storage (storage.md).
  - mia-docs: node and data-layer architecture.
  - Figma file "Mee - Design System": approved UI behavior and visual
    design. Ask the user for the file link when it is needed.
  - apps/app-tellipod/README.md: application code architecture.
  - openspec/specs/README.md: specification discovery entry point.

  Do not duplicate external source specifications. Reference them.
  Do not call a pod a folder or category. A category is a concept
  from which a pod was created.

  CONTEXT DISCOVERY

  Use progressive disclosure when exploring, proposing, designing,
  implementing, or reviewing changes.

  1. Start with openspec/specs/README.md to identify relevant areas.
  2. Follow area README.md indexes and their "Read when" guidance.
  3. Read only relevant leaf specs, ADRs, and code-practice documents.
  4. Follow "Depends on" links when the dependency affects the task.
  5. Read external sources or Figma when required to verify behavior.
  6. Inspect implementation code when implementation evidence is needed.
  7. Expand context when new dependencies or conflicts are discovered.

  Always apply openspec/specs/code-practices/README.md: its
  practices bind every change, so read the files it lists that
  match the work (TypeScript, screens or UI-kit components, specs).

  If the relevant file is already known, open it directly.
  Do not recursively load the specification tree.
  Do not treat an index summary as a substitute for the source document.
  Do not infer missing requirements from filenames or summaries.

  SPECIFICATION ORGANIZATION

  Capability IDs are paths relative to specs/, without /spec.md.
  A delta uses the same relative path under changes/<name>/specs/.
  Links inside a delta are written for the main tree, not for the
  change directory.

  - behaviour/: user-visible behavior. Use cases are small, from
    the user's side. journeys/ chain use cases for one persona and goal.
  - components/: technical contract of one component. Each spec
    that realizes use cases names them under "Realizes:"; ui-kit
    specs are shared building blocks and have none.
  - code-practices/: cross-cutting engineering requirements.
  - architecture/adr/: architectural decisions.

  Specifications describe app-observable behavior.
  Node and data-layer rules belong to their authoritative sources.
  Undecided behavior belongs under "Open questions".

  Documentation conventions:
  - Scenarios state positive outcomes: what the user does and then
    sees. Follow code-practices/spec-writing-guide.md.
  - One physical line per paragraph.
  - Scenario headings use exactly "#### Scenario:".
  - Use digits with thousands separators.
  - Do not invent abbreviations or notation.
  - Use present tense and stable requirements.
  - Preserve English platform terminology.

# Per-artifact rules. Each item is a folded scalar (>-): a plain scalar
# containing ": " parses as a mapping, and openspec then drops the
# artifact's rules whole.
rules:
  proposal:
    - >-
      Identify affected capabilities and authoritative sources.
      Read relevant existing specifications before proposing changes.
      Explain the motivation, scope, and boundaries.
    - >-
      Give the motivating case an example. For each open question,
      illustrate the alternatives using a concrete case with real
      values from the design or application. Start each example with
      "**Example:**". Use Markdown tables or fenced blocks where
      appropriate; omit contrived examples.
    - >-
      Keep unresolved decisions explicit. Do not invent behavior
      unsupported by the design or authoritative sources.

  design:
    - >-
      Describe selected decisions and their consequences. Separate
      application responsibilities from node and data-layer concerns,
      and link the authoritative sources.
    - >-
      Document rejected options under exactly
      "**Rejected alternatives:**". Use one list item per alternative.
      Include nested "**Pros:**" and "**Cons:**" only when substantial.
      Do not repeat rejected options in the selected decision text.
    - >-
      Identify affected components, capability dependencies,
      architectural constraints, and relevant ADRs.
      Create a new ADR only for a durable architectural decision.

  specs:
    - >-
      Each leaf spec opens with a title and a metadata list (Depends on,
      Realizes where it applies, Read when, and Source when derived from
      a Figma file/page or authoritative document), followed by
      "## Purpose".
    - >-
      Put user-side use cases in behaviour/, chained journeys in
      behaviour/journeys/, and technical contracts in components/.
      Journey scenarios have at most ten steps and name their starting
      state. Component specs link the use cases they realize.
    - >-
      Keep leaf specs near 120 lines or fewer. Split by cohesive
      capability when necessary.
    - >-
      Every requirement has at least one user-observable WHEN/THEN
      scenario. Verify behavior against Figma or authoritative
      specifications before asserting it. Unsupported behavior
      remains an open question.
    - >-
      Use exactly four heading hashes for scenarios:
      "#### Scenario:". A wrong heading level can silently
      exclude a scenario from validation.
    - >-
      A delta introducing a capability includes "## Purpose".
      Keep delta paths aligned with their eventual main spec paths.
      Write internal links for the main spec location.
    - >-
      Maintain hierarchical README.md indexes when capabilities
      are added, renamed, removed, or their Read when changes.
      Index updates are tasks against the main tree, not spec deltas.
    - >-
      Define shared domain terminology once and link to its
      authoritative definition instead of duplicating it.

  tasks:
    - >-
      Every added or modified scenario must map to implementation
      work and a meaningful verification. A check must fail if
      the mechanism being tested is removed.
    - >-
      Include tasks for affected indexes, documentation references,
      and dependency links when the change modifies them. Archive
      moves only spec files, so write one task per affected README.md
      naming the file and the row to add, rename, or remove, and
      run those tasks against the main tree.

operations:
  apply:
    guidance:
      - >-
        Before implementation, discover applicable code practices
        through the indexes. Follow apps/app-tellipod/README.md
        for vertical-slice boundaries and
        openspec/specs/code-practices/typescript-styleguide.md for TypeScript.
      - >-
        Keep routes thin. Use the project UI kit and design tokens,
        not ad hoc visual literals. Respect slice public APIs and
        documented cross-slice import boundaries.
      - >-
        Verify completed tasks with the narrowest relevant check:
        just lint, just typecheck, just knip, or just check.
        Do not mark tasks complete without verification.
      - >-
        Never perform state-changing Git operations.
        A human handles add, commit, checkout, push, and rebase.

  archive:
    guidance:
      - >-
        Run openspec validate --all --strict before archiving.
        Stop on failure. Inspect scenario heading levels manually;
        parser validation alone is insufficient.
      - >-
        After merging deltas, re-read affected main specs and verify
        their Depends on links.
      - >-
        Verify all affected README.md indexes: every entry has a row,
        and each row still matches the Read when guidance of the
        document it indexes. Rows may condense that guidance but must
        not contradict or omit a trigger.
      - >-
        Search active specs and changes for stale references after
        renaming or removing capabilities, screens, or terminology.
      - >-
        Obsolete ADRs remain stubs. Never reuse their numbers or
        cite them as current decisions.
      - >-
        Archiving does not authorize state-changing Git operations.
        A human handles add, commit, checkout, push, and rebase.
